# ===== Server =====
server.port=8080

# ===== PostgreSQL Database =====
# Secrets are injected at runtime; defaults are only for a local academic demo.
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/taskflow_db}
spring.datasource.username=${DATABASE_USERNAME:postgres}
spring.datasource.password=${DATABASE_PASSWORD:password}
spring.datasource.driver-class-name=org.postgresql.Driver

# ===== JPA / Hibernate =====
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=false

# ===== JWT =====
app.jwt.secret=${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
app.jwt.expiration=3600000
app.jwt.refresh-expiration=604800000

# ===== CORS =====
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000}

# Enable Redis Pub/Sub when Redis is available for multi-node WebSocket broadcasting.
app.redis.enabled=${REDIS_ENABLED:false}
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}

# ===== Logging =====
logging.level.com.taskflow=INFO
logging.level.org.springframework.security=WARN
logging.level.org.springframework.web.socket=WARN
